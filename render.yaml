services:
  - type: web
    name: foodtrack-pro
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TIMEZONE
        value: America/Martinique
      - key: DATABASE_URL
        fromDatabase:
          name: foodtrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false

databases:
  - name: foodtrack-db
    plan: basic-256mb
    databaseName: foodtrack
    user: foodtrack_user
